server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # nginx has no default mapping for .mjs, and vendor/suncalc.mjs is loaded as
  # an ES module: without this the browser refuses it on MIME type alone.
  types {
    text/html                             html;
    text/css                              css;
    application/javascript                js mjs;
    application/manifest+json             webmanifest;
    application/json                      json;
    image/png                             png;
    image/svg+xml                         svg;
    image/x-icon                          ico;
  }
  default_type application/octet-stream;

  # The service worker decides what the app caches. If nginx lets a browser
  # cache sw.js itself, a stale worker keeps serving stale files forever.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
